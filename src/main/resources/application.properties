spring.application.name=GHotel
server.port=8084
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_CONNECTION}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Sofia
spring.security.user.name=admin
spring.security.user.password=123
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost:8084/
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8084/
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET}