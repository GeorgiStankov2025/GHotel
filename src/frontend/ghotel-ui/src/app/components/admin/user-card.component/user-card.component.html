<div class="user-card">
  <div class="card bg-body-secondary text-black shadow-sm border-0 mb-3">
    <div class="row g-0 align-items-center justify-content-center">
      <div class="col-md-4">
        <img src="assets/7.jpg" class="img-fluid rounded-start w-100" alt="Room Image">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h3>Username: {{ user().username }}</h3>
          <p>Full name: {{ user().firstName + ' ' + user().lastName }}</p>
          <p class="mb-0">[Phone number placeholder]</p>
          <p class="mb-0">[Email address placeholder]</p><br>
          <button class="btn bg-danger btn-danger" type="submit" (click)="onDelete()">
            Delete User
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
