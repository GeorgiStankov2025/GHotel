<div class="reservation-card">
  <div class="card bg-body-secondary text-black shadow-sm border-0 mb-3">
    <div class="row g-0 align-items-center justify-content-center">
      <div class="col-md-4">
        <img src="assets/6.jpg" class="img-fluid rounded-start w-100" alt="Room Image">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h3>Reservation check-in: {{ reservation()?.checkIn |date:'dd.MM.yyyy, HH:mm' }}<br>
            Reservation check-out: {{ reservation()?.checkOut |date:'dd.MM.yyyy, HH:mm' }}</h3>
          <p class="mb-0"></p>
          <p class="mb-0">Reservation details: {{ reservation()?.details }}</p>
          <p class="mb-0"></p>
          @if (detailsIsAvailable()) {
            <button class="btn btn-secondary button" (click)="onSubmit()">Check details</button>
          }
          @if (!isDeleted()) {
            <button class="btn bg-danger btn-danger button" type="submit" (click)="onDelete()">
              Delete Reservation
            </button>
          } @else {
            <button class="btn bg-success btn-success button" type="submit" (click)="onRestore()">
              Restore Reservation
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
