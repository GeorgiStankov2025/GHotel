<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-3 p-md-4 rounded-4 customer-card">
    <form class="row g-3" [formGroup]="reservationForm"
          (ngSubmit)="onSubmit()">
      <h3 class="text-center mb-4">Reservation details</h3>
      <mat-form-field>
        <mat-label>Reservation details</mat-label>
        <input matInput type="text" formControlName="details">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Reservation period</mat-label>
        <mat-date-range-input [rangePicker]="picker">
          <input
            matStartDate
            formControlName="checkIn"
            placeholder="Check-in"/>
          <input
            matEndDate
            formControlName="checkOut"
            placeholder="Check-out"/>
        </mat-date-range-input>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
      <button class="btn bg-brown btn-primary" type="submit">Next</button>
    </form>
  </div>
</div>
