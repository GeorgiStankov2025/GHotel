<div class="room-details">
  @if (roomDetails()?.room) {
    <app-room-card [room]="roomDetails()?.room" [detailsIsAvailable]="false"></app-room-card>
  }
  <h3 class="reservations-header">Reservations</h3>
<div class="border border-gray-200 rounded-xl divide-y divide-gray-200 bg-white max-w-xl mx-auto">
  @for (reservation of roomDetails()?.reservations; track reservation?.id) {
    <app-reservation-card [reservation]="reservation"></app-reservation-card>
  }
</div>
</div>
